name: Elm Lab APK
on:
  push:
    branches: [elmlab]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elmlab-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: "Submodules - az terminology, remove phyphox.org links"
        run: |
          python3 tools/elmlab/az_fixes.py
          python3 tools/elmlab/strip_phyphox_org.py
          mkdir -p app/src/main/assets/experiments/elmlab_demo
          cp tools/elmlab/demo_experiments/*.phyphox app/src/main/assets/experiments/elmlab_demo/
      - name: Signing key from repository secrets
        env:
          ELMLAB_KEYSTORE_BASE64: ${{ secrets.ELMLAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ELMLAB_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ELMLAB_KEYSTORE_BASE64 is missing, see README"
            exit 1
          fi
          echo "$ELMLAB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/elmlab.jks"
          echo "ELMLAB_KEYSTORE_FILE=$RUNNER_TEMP/elmlab.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ELMLAB_KEYSTORE_PASSWORD: ${{ secrets.ELMLAB_KEYSTORE_PASSWORD }}
          ELMLAB_KEY_ALIAS: ${{ secrets.ELMLAB_KEY_ALIAS }}
          ELMLAB_KEY_PASSWORD: ${{ secrets.ELMLAB_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon -PelmlabBuild=${{ github.run_number }} assembleRegularRelease assembleDemoRelease 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|^e: |What went wrong|AAPT|ERROR" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/regular/release/*.apk "out/ElmLab-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/demo/release/*.apk "out/ElmLab-Numayis-b${{ github.run_number }}.apk"
          cp out/ElmLab-b${{ github.run_number }}.apk out/ElmLab.apk
          cp out/ElmLab-Numayis-b${{ github.run_number }}.apk out/ElmLab-Numayis.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ElmLab-apk
          path: out/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elmlab-b${{ github.run_number }}
          name: Elm Lab — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            Elm Lab — İnteraktiv Elm Muzeyi üçün fizika təcrübələri tətbiqi.
            phyphox (RWTH Aachen, GPL-3.0) əsasında hazırlanıb; mənbə kodu bu repozitoriyadadır.
            ElmLab-*.apk — tam tətbiq; ElmLab-Numayis-*.apk — yalnız 4 muzey nümayişi.
            Quraşdırma: APK faylını telefona endirin və açın.
